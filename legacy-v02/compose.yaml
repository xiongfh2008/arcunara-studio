services:
  api:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server.mjs"]

    user: node
    read_only: true

    ports:
      - "127.0.0.1:18088:3000"
      - "127.0.0.1:18089:3001"

    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./data:/app/data
      - ./secrets/api_token:/run/secrets/api_token:ro

    tmpfs:
      - /tmp

    cpus: 0.30
    mem_limit: 192m
    pids_limit: 64

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
