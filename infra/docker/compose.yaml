# Arcunara Studio — isolated v0.3.0 test environment.
#
# Project/container names are deliberately distinct from ANY existing
# deployment (in particular from the v0.2.0 compose project derived from
# /opt/arcunara-studio-dev): never reuse the v0.2.0 project name — see
# docs/deployment.md and scripts/compose-preflight.mjs.
#
# This stack never touches /opt/arcunara-studio-dev or ports 18088/18089.
#
# Security posture (same as the validated v0.2.0 baseline):
# non-root user, read-only rootfs, dropped capabilities, no-new-privileges,
# tmpfs /tmp, CPU/memory/PID limits, localhost-only port binding,
# healthcheck. Application code and dependencies are baked into the image
# (infra/docker/Dockerfile); data and tokens are injected at runtime.

name: arcunara-studio-v03-test

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: arcunara-studio:0.3.0
    container_name: arcunara-studio-api-v03-test
    working_dir: /app
    command: ["node", "apps/api/server.mjs"]

    user: node
    read_only: true

    ports:
      # Deliberately different from the existing deployment (18088/18089).
      # Bound to loopback only — access from a laptop via SSH port forwarding.
      - "127.0.0.1:28088:3000"
      - "127.0.0.1:28089:3001"

    environment:
      # Browser-facing base URL for preview links built by the workbench
      # (/console). Default matches the host port mapping above so SSH
      # local port forwarding works out of the box. Override with the
      # ARCU_PREVIEW_PUBLIC_BASE_URL environment variable (e.g. a future
      # dedicated preview origin like https://preview.example.com) without
      # any workbench code changes. Never includes tokens.
      - "ARCU_PREVIEW_PUBLIC_BASE_URL=${ARCU_PREVIEW_PUBLIC_BASE_URL:-http://127.0.0.1:28089}"

      # Opt-in Cloudflare Access SSO for the staging admin console. All four
      # values must be set together (via private, gitignored root .env).
      # Never enable ARCU_LOCAL_AUTO_LOGIN in the VPS container.
      - "ARCU_ACCESS_ISSUER=${ARCU_ACCESS_ISSUER:-}"
      - "ARCU_ACCESS_AUDIENCE=${ARCU_ACCESS_AUDIENCE:-}"
      - "ARCU_ACCESS_ADMIN_EMAIL=${ARCU_ACCESS_ADMIN_EMAIL:-}"
      - "ARCU_ACCESS_ORIGIN=${ARCU_ACCESS_ORIGIN:-}"

      # Staging-only public preview gateway: default OFF until Nginx and
      # Cloudflare path-specific policies have been safely configured.
      - "ARCU_STAGING_PUBLIC_PREVIEW=${ARCU_STAGING_PUBLIC_PREVIEW:-0}"

      # Internal test-env quotas, sized for real Axure RP11 exports
      # (2,786 entries / 4.6 MiB max HTML / 72.6 MiB total — see
      # docs/KNOWN_LIMITATIONS.md). Production-safe defaults live in
      # apps/api/lib/config.mjs and are NOT raised by this file alone.
      - "ARCU_MAX_FILES=${ARCU_MAX_FILES:-5000}"
      - "ARCU_MAX_HTML_BYTES=${ARCU_MAX_HTML_BYTES:-8388608}"
      - "ARCU_MAX_EXTRACT_BYTES=${ARCU_MAX_EXTRACT_BYTES:-134217728}"

    volumes:
      - ./data:/app/data
      - ./secrets/api_token:/run/secrets/api_token:ro

    tmpfs:
      - /tmp

    cpus: 0.30
    mem_limit: 192m
    pids_limit: 64

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
