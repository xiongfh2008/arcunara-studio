# RC21 visual acceptance stack — separate from legacy and RC19/RC20 staging.
# Run from repo root: docker compose -f infra/rc21-preview/compose.yaml up -d --build
name: arcunara-rc21-preview
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: arcunara-studio:rc21-preview
    container_name: arcunara-api-rc21-preview
    user: node
    working_dir: /app
    read_only: true
    ports:
      - "127.0.0.1:29088:3000"
      - "127.0.0.1:29089:3001"
    environment:
      - "ARCU_DATA_DIR=/app/data"
      - "ARCU_TOKEN_FILE=/run/secrets/api_token"
      - "ARCU_API_HOST=0.0.0.0"
      - "ARCU_PREVIEW_HOST=0.0.0.0"
      - "ARCU_LOCAL_AUTO_LOGIN=0"
      - "ARCU_PREVIEW_PUBLIC_BASE_URL=http://127.0.0.1:29089"
      - "ARCU_TEAM_ACCESS_ENABLED=0"
      - "ARCU_MEMBER_LOGIN_ENABLED=0"
      - "ARCU_SITE_HOSTING_ENABLED=0"
      - "ARCU_AI_ENABLED=${ARCU_AI_ENABLED:-0}"
      - "ARCU_AI_API_KEY_FILE=/run/secrets/ai_api_key"
      - "ARCU_MAX_FILES=3000"
      - "ARCU_MAX_HTML_BYTES=8388608"
      - "ARCU_MAX_EXTRACT_BYTES=134217728"
    volumes:
      - ./data:/app/data
      - ./secrets/api_token:/run/secrets/api_token:ro
      - ./secrets/ai_api_key:/run/secrets/ai_api_key:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
