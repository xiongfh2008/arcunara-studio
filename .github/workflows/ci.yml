name: CI

# Code quality only — this workflow never builds images and never deploys.
# VPS deployments are manual and documented in docs/deployment.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint & Test (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Deployment preflight
        run: npm run preflight

      - name: RC21 isolated preview preflight
        run: npm run preflight:rc21

      - name: Tests
        run: npm test

      - name: RC21 Docker image build smoke
        run: docker build --file infra/docker/Dockerfile --tag arcunara-studio:rc21-ci .

      - name: RC23 offline Zee-RP worker image build smoke
        run: docker build --file infra/docker/Dockerfile.native-rp-worker --tag arcunara-studio:native-rp-ci .
