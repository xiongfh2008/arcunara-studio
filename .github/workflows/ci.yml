name: CI

# Code quality only — this workflow never builds images and never deploys.
# VPS deployments are manual and documented in docs/deployment.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint & Test (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check
        run: npm run lint

      - name: Tests
        run: npm test
